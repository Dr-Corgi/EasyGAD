# TLGAD (Token-Level GAD) Training Stage Configuration
# This stage performs student rollout + discriminator update + PPO update with token-level credit assignment
# Key features:
#   - Logit space transformation: r(y) = log[D(y)/(1-D(y))]
#   - Token-level credit assignment via policy divergence modulation
#   - Dynamic EMA reference policy update

trainer:
  training_stage: "tlgad"
  total_epochs: 10
  critic_warmup: 0

algorithm:
  adv_estimator: "tlgad"  # Token-Level GAD advantage estimator
  use_kl_in_reward: false
  gamma: 1.0
  lam: 1.0
  norm_adv_by_std_in_grpo: true
  # TLGAD specific hyperparameters
  tlgad_lambda: 0.8  # Modulation coefficient for token-level credit assignment
  tlgad_temperature: 1.0  # Temperature for tanh scaling (auto-computed from std(d) if 1.0)
  tlgad_epsilon: 1.0e-8  # Numerical stability term

actor_rollout_ref:
  actor:
    strategy: "fsdp"
    ppo_epochs: 1
    clip_ratio: 0.2  # γ in the paper, PPO clipping parameter
    entropy_coeff: 0.0
    # TLGAD EMA reference policy settings
    use_ema_reference: true
    tlgad_ema_momentum: 0.99  # α in the paper, EMA momentum coefficient
    policy_loss:
      loss_mode: "clip_cov"  # PPO loss for TLGAD
  rollout:
    n: 8  # Group size G for GRPO
    temperature: 1.0

critic:
  ppo_epochs: 1
